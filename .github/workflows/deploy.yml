name: Deploy

on:
  schedule:
    - cron: '5 16 * * *'
    - cron: '5 17 * * *'
    - cron: '5 18 * * *'
    - cron: '5 19 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Build and deploy even if no newer rate data is available'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: build
        name: Build
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: deepseek/deepseek-v4-flash
          REGION_CODE: J
          REGION_NAME: South East England
          PRODUCT_CODE: AGILE-24-10-01
          # Only the last cron of the day sets this, so a publication window
          # that passed with no new rates fails loudly instead of skipping
          # quietly four times over.
          LAST_ATTEMPT: ${{ github.event.schedule == '5 19 * * *' }}
        # A push is a code change that should ship regardless of rate data.
        run: node scripts/build.mjs ${{ (inputs.force || github.event_name == 'push') && '--force' || '' }}
      - if: ${{ steps.build.outputs.skip != 'true' }}
        uses: actions/configure-pages@v5
      - if: ${{ steps.build.outputs.skip != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: ${{ steps.build.outputs.skip != 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4
